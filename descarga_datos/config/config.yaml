# ✅ CONFIGURACIÓN PRODUCTIVA CENTRALIZADA - BOT TRADER v4.8
# Sistema migrado a MT5 con Volatility 75 Index de Deriv
# TIMEFRAME: 15m (alineado con modelo ML entrenado)
# CAPITAL: 10000 USD (demo Deriv)
# 🔄 ACTUALIZADO: 1-Nov-2025 - Usando MT5 Deriv para Trading con Volatility Indices

active_exchange: binance

backtesting:
  commission: 0.1                    # 0.1% comisión
  data_quality: null
  end_date: '2025-10-24'             # Backtest: 24-Junio-2024 a 24-Oct-2025
  initial_capital: 1000              # 1000 USD (Capital inicial)
  start_date: '2024-06-01'           # Backtest: 01-Junio-2024
  
  # ✅ PARÁMETROS BASE - Copiados de config_original.yaml
  base_parameters:
    atr_period: 17
    cci_threshold: 90
    ema_trend_period: 50
    kelly_fraction: 0.1
    liquidity_score_min: 5
    max_concurrent_trades: 1
    max_drawdown: 0.03
    max_portfolio_heat: 0.05
    min_rr_ratio: 2.5
    ml_threshold: 0.2
    ml_threshold_max: 0.8
    ml_threshold_min: 0.2
    risk_per_trade: 0.02
    sar_acceleration: 0.04
    sar_maximum: 0.26
    stoch_overbought: 70
    stoch_oversold: 35
    stop_loss_atr_multiplier: 2.25
    take_profit_atr_multiplier: 3.75
  # Permitir instrumentos sintéticos (ej. Volatility Indices) con volume=0
  # Ajuste temporal: 0.0 para evitar que filtros de volumen bloqueen señales en live
  volume_ratio_min: 0.0
  
  # ⚠️ PARÁMETROS OPTIMIZADOS (Por símbolo)
  optimized_parameters:
    EURUSD:
      atr_period: 17
      cci_threshold: 90
      ema_trend_period: 50
      kelly_fraction: 0.1
      liquidity_score_min: 5
      max_concurrent_trades: 1
      max_drawdown: 0.03
      max_portfolio_heat: 0.05
      min_rr_ratio: 2.5
      ml_threshold: 0.2
      ml_threshold_max: 0.8
      ml_threshold_min: 0.2
      risk_per_trade: 0.02
      sar_acceleration: 0.04
      sar_maximum: 0.26
      stoch_overbought: 70
      stoch_oversold: 35
      stop_loss_atr_multiplier: 2.25
      take_profit_atr_multiplier: 3.75
  # EURUSD tiene volumen normal en Forex
  volume_ratio_min: 0.1
  # Forzar umbral de volumen a 0 para que checks como `volume > 0` no bloqueen señales
  volume_threshold: 0
  
  slippage: 0.05                     # Slippage de config_original
  
  strategies:
    HeikinNeuronalMLPruebas: false
    UltraDetailedHeikinAshiML: true
  
  strategy_paths:
    HeikinNeuronalMLPruebas:
    - strategies.heikin_neuronal_ml_pruebas
    - HeikinNeuronalMLPruebasStrategy
    UltraDetailedHeikinAshiML:
    - strategies.ultra_detailed_heikin_ashi_ml_strategy
    - UltraDetailedHeikinAshiMLStrategy
  
  symbol_selection:
    EURUSD: true                     # ✅ EURUSD (Forex MT5)
  
  symbols:
    - EURUSD                         # ✅ Símbolo: EURUSD (MT5 Forex)
  timeframe: 4h                      # Timeframe para Forex backtest
  
  # ========== TIPO DE TRADING ==========
  # MT5 Deriv usa margin trading con apalancamiento
  trading_mode: margin              # MARGIN: Apalancamiento directo en Deriv
  
  # Configuración de Margin Trading (DERIV MT5)
  margin_type: cross                # 'cross' (riesgo compartido)
  margin_leverage: 1                # 1x para demo (sin apalancamiento inicial)

# ⚡ CONFIGURACIÓN LIVE TRADING - MT5 DERIV (v4.11)
live_trading:
  # Configuración de cuenta y modo de trading
  account_type: 'DEMO'              # 'DEMO' para Deriv demo account
  trading_mode: 'margin'            # 'margin' para MT5 Deriv
  enable_position_limit: true       # Limitar posiciones concurrentes
  max_positions: 5                  # Máximo 5 posiciones concurrentes (v4.9 FIX)
  allow_multiple_positions_same_symbol: true  # Permite múltiples por símbolo (v4.9 FIX)
  
  # FIX v4.11: Alinear timeframes entre backtest y live
  # Backtest usa 4h, live debe usar el mismo o adaptado
  timeframes: ['4h']                # Usar 4h para consistencia con backtest
  symbols: ['EURUSD']               # Mismo símbolo que backtest
  
  # FIX v4.11: Configuración de barras históricas
  history_bars: 1000                # 1000+ barras para contexto ML equivalente
  
  # FIX v4.11: Deshabilitar agregación por ticks (causa 99.3% duplicación)
  use_tick_aggregation: false       # Usar datos históricos directos de MT5
  
  # Configuración de riesgo
  risk_per_trade: 0.02              # 2% riesgo por trade
  max_account_drawdown: 0.05        # 5% máximo drawdown de cuenta
  
  # Configuración de sincronización
  position_sync_timeout: 5          # Timeout para sincronización de posiciones
  position_sync_interval_seconds: 30  # Reducido a 30 seg para sincronización más rápida (v4.9)
  position_sync_interval: 10        # Intervalo entre sincronizaciones
  use_open_orders_only: false       # Usar solo órdenes abiertas para sincronización
  
  # FIX v4.11: Intervalos basados en cierre de vela (no fijos)
  # El sistema ahora sincroniza con cierres de vela automáticamente
  # Este valor se usa solo como fallback cuando estamos cerca del cierre
  update_interval_seconds: 5        # Fallback interval (usado solo cerca de cierre de vela)
  
  # Configuración de órdenes
  order_lock_timeout: 30            # Timeout para bloqueo de órdenes
  
  # Configuración específica de MT5
  margin_type: 'cross'              # 'cross' para Deriv
  margin_leverage: 1                # 1x leverage (sin apalancamiento para demo)
  
  # Configuración de cierre automático (v4.9)
  enable_auto_close_tp_sl: true     # Habilitar cierre automático en TP/SL
  enable_trailing_stop: true        # Habilitar trailing stop dinámico
  trailing_stop_pct: 0.65           # Trailing stop al 0.65%

compensation_strategy:
  compensation_max_loss: 1.0
  emergency_stop_buffer: 0.8
  enabled: true
  loss_threshold: 0.5
  max_account_drawdown: 3.0
  risk_multiplier_high_dd: 0.7
  size_multiplier: 3.0
  tp_percent: 0.5

data:
  limit_per_request: 2000
  max_retries: 3
  retry_delay: 5
  use_ccxt_for_crypto: false        # ❌ DESACTIVADO - Usando MT5
  use_mt5_for_stocks: true          # ✅ ACTIVADO - Usando MT5 para Volatility Indices
  validate_data: true

# 🔧 CONFIGURACIÓN MT5 - DERIV (v4.11)
mt5:
  enabled: true                     # ✅ ACTIVADO - Proveedor principal
  login: 175399                     # ⚠️ Se carga desde .env: MT5_LOGIN
  password: ''                      # ⚠️ Se carga desde .env: MT5_PASSWORD
  server: 'ThinkMarkets-Demo'       # Servidor ThinkMarkets Demo
  terminal_path: 'C:\\Program Files\\MetaTrader 5\\terminal64.exe'  # Ruta MT5
  timeout: 30000
  
  # FIX v4.11: Configuración de datos históricos
  history_bars: 1000                # 1000+ barras para contexto ML
  use_tick_aggregation: false       # Deshabilitar agregación por ticks
  
  # FIX v4.11: Símbolos y timeframes para live
  symbols:
    - EURUSD
  timeframes:
    - 4h
  
  # Configuración de reintentos
  max_retries: 3
  retry_delay: 5

exchanges:
  binance:
    api_key: ''
    api_secret: ''
    enabled: false         # ❌ DESACTIVADO - Usando MT5 Deriv
    sandbox: true
    timeout: 30000
  kraken:
    api_key: ''
    api_secret: ''
    enabled: false         # ❌ DESACTIVADO - Usando MT5 Deriv
    sandbox: true
    timeout: 30000
  krakenfutures:
    api_key: ''
    api_secret: ''
    enabled: false         # ❌ DESACTIVADO - Usando MT5 Deriv
    sandbox: true          # ⚠️ NOTA: Requiere cuenta real para operar con CCXT
    timeout: 30000
  bybit:
    api_key: ''
    api_secret: ''
    enabled: false         # ❌ DESACTIVADO
    sandbox: true
    timeout: 30000
  okx:
    api_key: ''
    api_secret: ''
    enabled: false         # ❌ DESACTIVADO
    sandbox: true
    timeout: 30000
  kucoin:
    api_key: ''
    api_secret: ''
    enabled: false         # ❌ DESACTIVADO
    sandbox: true
    timeout: 30000

indicators:
  adx:
    enabled: true
    period: 14
    threshold: 20          # Reducido de 25 (menos restrictivo)
  atr:
    enabled: true
    period: 14
  ema:
    enabled: true
    periods:
    - 10
    - 20
    - 200
  heikin_ashi:
    enabled: true
    size_comparison_threshold: 1.0     # Reducido de 1.2 (más sensible)
    trend_period: 3
  parabolic_sar:
    acceleration: 0.03                 # Aumentado de 0.02
    enabled: true
    maximum: 0.25                      # Aumentado de 0.2
  volatility:
    enabled: true
    method: standard_deviation
    period: 14

# 🧪 CONFIGURACIÓN ESPECÍFICA PARA PRUEBAS
live_trading_test:
  enabled: true
  log_all_signals: true                # Registra todos los signals
  max_trades_per_session: 10           # Límite de trades por sesión de pruebas
  test_duration_minutes: 60            # Duración de prueba (1 hora)
  detailed_logging: true               # Logs detallados de cada operación
  validate_calculations: true          # Valida cálculos en cada trade
  print_trade_details: true            # Imprime detalles en consola

# 📊 RESUMEN DE CAMBIOS VS PRODUCTIVO
# ================================
# PARÁMETRO                    | PRODUCTIVO | PRUEBAS | RAZÓN
# --------------------------------
# max_concurrent_trades        | 1         | 2       | ↑ Más operaciones
# risk_per_trade               | 0.02      | 0.03    | ↑ Más riesgo permitido
# cci_threshold                | 90        | 85      | ↓ Menos restrictivo
# ml_threshold                 | 0.2       | 0.15    | ↓ Más sensible
# initial_capital              | 800       | 100     | ↓ Menos capital
# max_portfolio_heat           | 0.05      | 0.08    | ↑ Más calor de cartera
# liquidity_score_min          | 5         | 3       | ↓ Menos restrictivo
# stoch_oversold               | 35        | 30      | ↓ Más oportunidades
# volume_ratio_min             | 0.3       | 0.2     | ↓ Menos restrictivo

# 🧠 CONFIGURACIÓN DE ENTRENAMIENTO ML - OPTIMIZADO PARA >0.6 ACCURACY
ml_training:
  training:
    train_start: '2023-06-01'    # Entrenamiento: 01-Jun-2023 a 31-Dic-2024 (19 meses)
    train_end: '2024-12-31'      # Fin período entrenamiento
    val_start: '2025-01-01'      # Validación: 01-Ene-2025 a 01-Jun-2025 (5 meses)
    val_end: '2025-06-01'        # Fin período validación
    # 🔥 MEJORAS PARA >0.6 ACCURACY:
    # - Más datos de entrenamiento (19 meses vs previos)
    # - Validación separada temporalmente para evitar overfitting
    # - Balanceo de clases automático en RandomForest
    # - Features mejoradas: 48+ características vs 25 previas
    # - Target más predictivo: movimientos significativos normalizados por ATR
  optimization:
    enabled: true                # ✅ HABILITADO - Ejecutar optimización
    opt_start: '2024-06-01'      # Optimización: 01-Jun-2024 a 01-Jun-2025 (12 meses)
    opt_end: '2025-06-01'        # Fin período optimización

