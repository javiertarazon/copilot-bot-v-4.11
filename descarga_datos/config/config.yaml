# ✅ CONFIGURACIÓN PRODUCTIVA CENTRALIZADA - BOT TRADER v4.8
# Sistema migrado a MT5 con Volatility 75 Index de Deriv
# TIMEFRAME: 15m (alineado con modelo ML entrenado)
# CAPITAL: 10000 USD (demo Deriv)
# 🔄 ACTUALIZADO: 1-Nov-2025 - Usando MT5 Deriv para Trading con Volatility Indices

active_exchange: mt5

backtesting:
  commission: 0.0005                 # 0.05% comisión (Estándar índices)
  data_quality: null
  end_date: '2025-01-01'             # ✅ OOS 2024 (1 Año)
  initial_capital: 5000              # ✅ Capital $5000 (Para probar escala)
  start_date: '2024-01-01'           # ✅ OOS 2024 (1 Año)
  
  # ✅ PARÁMETROS BASE - Copiados de config_original.yaml
  base_parameters:
    atr_period: 17
    cci_threshold: 90
    ema_trend_period: 50
    kelly_fraction: 0.25            # ✅ CORREGIDO: Cuarto-Kelly (conservador, era 1.0)
    liquidity_score_min: 1          # 🔥 MODIFICADO: Reducido a 1 para permitir índices sintéticos
    max_concurrent_trades: 3         # ✅ CORREGIDO: Reducido de 10 a 3 (más controlado)
    max_drawdown: 0.25               # ✅ CORREGIDO: Máximo 25% drawdown (era 0.95)
    max_portfolio_heat: 0.15         # ✅ CORREGIDO: 15% exposición máxima (era 0.80)
    min_rr_ratio: 2.0               # Reducido levemente para asegurar TPs alcanzables
    ml_threshold: 0.45               # 🔙 RESTAURADO FASE 3: 0.45 (Optimo)
    ml_threshold_max: 0.85
    ml_threshold_min: 0.40           # 🔙 RESTAURADO FASE 3
    risk_per_trade: 1.5              # Compromiso seguridad/retorno
    sar_acceleration: 0.04
    sar_maximum: 0.26
    stoch_overbought: 70
    stoch_oversold: 35
    stop_loss_atr_multiplier: 2.5    # Aumentado para evitar ruido
    take_profit_atr_multiplier: 3.75
    # Permitir instrumentos sintéticos (ej. Volatility Indices) con volume=0
    # Ajuste temporal: 0.0 para evitar que filtros de volumen bloqueen señales en live
    volume_ratio_min: 0.0
    # Forzar umbral de volumen a 0 para que checks como `volume > 0` no bloqueen señales
    volume_threshold: 0
    
    # [THOR] CIRCUIT BREAKER
    daily_loss_limit_pct: 5.0        # 🛡️ Límite de pérdida diaria 5%

  # ⚠️ PARÁMETROS OPTIMIZADOS (Por símbolo)
  optimized_parameters:
    TM_VOLATILITY_100:              # ✅ PARÁMETROS ESPECÍFICOS PARA VOLATILITY 100
      risk_per_trade: 1.5           # 🔥 AJUSTADO: 1.5% (era 5.0%)
      max_drawdown: 0.25            # 🔥 AJUSTADO: 25% (era 95%)
      max_concurrent_trades: 1
      kelly_fraction: 0.3           # 🔥 AJUSTADO: 0.3 (era 1.0)
      stop_loss_atr_multiplier: 2.5 # 🔥 AJUSTADO: 2.5 (era 1.5)
      take_profit_atr_multiplier: 4.5
      trailing_stop_atr_multiplier: 1.5
      
    TM_VOLATILITY_75:               # ✅ AGREGADO: Volatility 75
      risk_per_trade: 1.5
      ml_threshold_min: 0.44        # OPTIMIZADO: Trial 19 (Max Stability)
      stop_loss_atr_multiplier: 2.5 # OPTIMIZADO
      take_profit_atr_multiplier: 5.5
      atr_period: 13
      ema_trend_period: 15
      
    TM_VOLATILITY_50:               # ✅ AGREGADO: Volatility 50
      risk_per_trade: 1.5
      ml_threshold_min: 0.38        # 🔥 REBAJADO: de 0.42 a 0.38 para despertar trading
      stop_loss_atr_multiplier: 3.5
      take_profit_atr_multiplier: 6.25
      atr_period: 15
      ema_trend_period: 105
      
  # EURUSD tiene volumen normal en Forex
  volume_ratio_min: 0.1
  
  # Límites Generales Backtesting
  max_position_size: 5.0
  max_position_crypto: 10.0
  max_risk_per_trade_usd: 300.0       # ✅ SINCRONIZADO: Igual que live_trading (era 500.0)
  
  slippage: 0.0002                   # 0.02% Slippage realista (antes 0.05 = 5%!!)
  
  strategies:
    HeikinNeuronalMLPruebas: false
    UltraDetailedHeikinAshiML: true
  
  strategy_paths:
    HeikinNeuronalMLPruebas:
    - strategies.heikin_neuronal_ml_pruebas
    - HeikinNeuronalMLPruebasStrategy
    UltraDetailedHeikinAshiML:
    - strategies.ultra_detailed_heikin_ashi_ml_strategy
    - UltraDetailedHeikinAshiMLStrategy
  
  symbol_selection:
    EURUSD: true                     # ✅ EURUSD (Forex MT5)
  
  symbols:
    - TM_VOLATILITY_100
    - TM_VOLATILITY_75
    - TM_VOLATILITY_50
  timeframe: 15m                     # Timeframe 15m (Solicitado)
  
  # ========== TIPO DE TRADING ==========
  # MT5 Deriv usa margin trading con apalancamiento
  trading_mode: margin              # MARGIN: Apalancamiento directo en Deriv
  
  # Configuración de Margin Trading (DERIV MT5)
  margin_type: cross                # 'cross' (riesgo compartido)
  margin_leverage: 500              # 500x para índices ThinkMarkets (Estándar)

# ========== CONFIGURACIÓN ZMQ (ZeroMQ Bridge) ==========
# Comunicación de baja latencia con EA en MT5
zmq:
  enabled: false                    # true para usar ZMQ, false para MT5 directo
  orders_url: "tcp://localhost:5555"  # URL socket para órdenes (REQ/REP)
  ticks_url: "tcp://localhost:5556"   # URL socket para ticks (PUB/SUB)
  timeout_ms: 5000                  # Timeout en milisegundos
  heartbeat_interval: 10            # Intervalo de heartbeat (segundos)
  magic_number: 20260129            # Magic number para identificar órdenes del bot

# ⚡ CONFIGURACIÓN LIVE TRADING - MT5 DERIV (v4.9)
live_trading:
  # ========== TIPO DE EXECUTOR ==========
  # 'mt5' = API de MetaTrader5 directo (por defecto)
  # 'zmq' = ZeroMQ Bridge con EA (baja latencia, requiere EA corriendo)
  # Tipo de ejecutor:
  # - 'mt5': Conexión directa Python → MT5 (por defecto)
  # - 'zmq': Comunicación vía ZeroMQ (requiere ZMQ_Bridge_EA compilado)
  # - 'simple': Simple Bridge EA (archivos, sin dependencias, RECOMENDADO)
  executor_type: 'simple'           # ✅ RECOMENDADO: Ejecución nativa segura y rápida
  
  # Configuración de cuenta y modo de trading
  account_type: 'DEMO'              # 'DEMO' para Deriv demo account
  trading_mode: 'margin'            # 'margin' para MT5 Deriv
  enable_position_limit: true       # Limitar posiciones concurrentes
  max_positions: 3                  # Máximo 3 posiciones concurrentes (Igual que backtest)
  allow_multiple_positions_same_symbol: true  # Permite múltiples por símbolo (v4.9 FIX)
  
  # Configuración de riesgo
  # Configuración de riesgo
  risk_per_trade: 1.0               # ✅ CORREGIDO: 1% (Igual que backtest)
  max_account_drawdown: 0.25        # ✅ CORREGIDO: 25% max drawdown (era 0.80)
  max_position_size: 2.0            # ✅ CORREGIDO: 200% exposición máxima (era 5.0)
  max_risk_per_trade_usd: 300.0     # ✅ SINCRONIZADO: Igual que backtesting (era 200.0)
  max_position_crypto: 10.0         # Eliminar límite hardcode de crypto (10 unidades)
  
  # Configuración de sincronización
  position_sync_timeout: 5          # Timeout para sincronización de posiciones
  position_sync_interval_seconds: 30  # Reducido a 30 seg para sincronización más rápida (v4.9)
  position_sync_interval: 10        # Intervalo entre sincronizaciones
  use_open_orders_only: false       # Usar solo órdenes abiertas para sincronización
  
  # Configuración de órdenes
  order_lock_timeout: 30            # Timeout para bloqueo de órdenes
  
  # Configuración específica de MT5
  margin_type: 'cross'              # 'cross' para Deriv
  margin_leverage: 1                # 1x leverage (sin apalancamiento para demo)
  
  # Configuración de cierre automático (v4.9)
  enable_auto_close_tp_sl: true     # Habilitar cierre automático en TP/SL
  enable_trailing_stop: true        # Habilitar trailing stop dinámico
  trailing_stop_pct: 0.65           # Trailing stop al 0.65%
  
  # ========== CONFIGURACIÓN DE ESTRATEGIAS PARA LIVE TRADING ==========
  strategy_mapping:
    UltraDetailedHeikinAshiMLStrategy:
      active: true                  # Activar estrategia para live trading
      symbols:
        - TM_VOLATILITY_100
        - TM_VOLATILITY_75
        - TM_VOLATILITY_50
      timeframe: 15                 # 15 minutos (MT5 format)
      risk_per_trade_usd: 300.00    # $300 USD por operación (sincronizado con risk_management)
      
      # Parámetros de riesgo (heredados de backtesting)
      risk_per_trade: 1.0           # 1% riesgo por trade
      max_drawdown: 0.25            # 25% máximo drawdown
      max_concurrent_trades: 3      # Máximo 3 trades simultáneos
      kelly_fraction: 0.25          # Cuarto-Kelly conservador
      
      # Parámetros de indicadores
      indicators:
        atr_period: 17
        cci_threshold: 90
        ema_trend_period: 50
        rsi_period: 14
        rsi_overbought: 70
        rsi_oversold: 30
        bollinger_period: 20
        bollinger_std: 2
        stoch_k_period: 14
        stoch_d_period: 3
        stoch_smooth_k: 3
      
      # Stop Loss y Take Profit
      stop_loss_atr_multiplier: 2.5
      take_profit_atr_multiplier: 3.75
      min_rr_ratio: 2.0
      
      # Machine Learning thresholds
      ml_thresholds:
        ml_threshold: 0.52          # Umbral de confianza ML
        ml_threshold_max: 0.85
        ml_threshold_min: 0.52
      
      # Filtros adicionales
      filters:
        liquidity_score_min: 1      # Permitir índices sintéticos
        volume_threshold: 0         # Sin filtro de volumen para Volatility
        volume_ratio_min: 0.0
        min_rr_ratio: 2.0           # Risk/Reward mínimo 1:2

