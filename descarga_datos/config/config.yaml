indicators:
  adx:
    enabled: true
    period: 14
    threshold: 20          # Reducido de 25 (menos restrictivo)
  atr:
    enabled: true
    period: 14
  ema:
    enabled: true
    periods:
    - 10
    - 20
    - 200
  heikin_ashi:
    enabled: true
    size_comparison_threshold: 1.0     # Reducido de 1.2 (más sensible)
    trend_period: 3
  parabolic_sar:
    acceleration: 0.03                 # Aumentado de 0.02
    enabled: true
    maximum: 0.25                      # Aumentado de 0.2
  volatility:
    enabled: true
    method: standard_deviation
    period: 14

# 🧪 CONFIGURACIÓN ESPECÍFICA PARA PRUEBAS
live_trading_test:
  enabled: true
  log_all_signals: true                # Registra todos los signals
  max_trades_per_session: 10           # Límite de trades por sesión de pruebas
  test_duration_minutes: 60            # Duración de prueba (1 hora)
  detailed_logging: true               # Logs detallados de cada operación
  validate_calculations: true          # Valida cálculos en cada trade
  print_trade_details: true            # Imprime detalles en consola

# 📊 RESUMEN DE CAMBIOS VS PRODUCTIVO
# ================================
# PARÁMETRO                    | PRODUCTIVO | PRUEBAS | RAZÓN
# --------------------------------
# max_concurrent_trades        | 1         | 2       | ↑ Más operaciones
# risk_per_trade               | 0.02      | 0.03    | ↑ Más riesgo permitido
# cci_threshold                | 90        | 85      | ↓ Menos restrictivo
# ml_threshold                 | 0.2       | 0.15    | ↓ Más sensible
# initial_capital              | 800       | 100     | ↓ Menos capital
# max_portfolio_heat           | 0.05      | 0.08    | ↑ Más calor de cartera
# liquidity_score_min          | 5         | 3       | ↓ Menos restrictivo
# stoch_oversold               | 35        | 30      | ↓ Más oportunidades
# volume_ratio_min             | 0.3       | 0.2     | ↓ Menos restrictivo

# 🧠 CONFIGURACIÓN DE ENTRENAMIENTO ML - OPTIMIZADO PARA >0.6 ACCURACY
ml_training:
  training:
    train_start: '2023-06-01'    # Entrenamiento: ~1.5 Años
    train_end: '2024-12-31'      
    val_start: '2025-01-01'      # Validación: 6 Meses
    val_end: '2025-06-30'        
    # 🔥 MEJORAS PARA >0.6 ACCURACY:
    # - Más datos de entrenamiento
    # - Validación separada temporalmente para evitar overfitting
    # - Balanceo de clases automático en RandomForest
  optimization:
    enabled: true                # ✅ HABILITADO - Ejecutar optimización
    opt_start: '2025-07-01'      # AJUSTE: Usar periodo con datos confirmados
    opt_end: '2025-10-30'
    n_trials: 20                 # Reducido para prueba rápida exitosa

