system:
  name: "Bot Trader Copilot XAUUSD"
  version: "4.11-canonical"
  log_level: "INFO"
  log_file: "descarga_datos/logs/bot_trader_xauusd.log"
  auto_launch_dashboard: false

active_exchange: mt5

backtesting:
  commission: 0.1
  end_date: "2019-12-31"
  initial_capital: 1000
  start_date: "2019-01-01"
  timeframe: "15m"
  symbols:
    - XAUUSD
  symbol_selection:
    XAUUSD: true
  strategies:
    UltraDetailedHeikinAshiML: true
  strategy_paths:
    UltraDetailedHeikinAshiML:
      - strategies.ultra_detailed_heikin_ashi_ml_strategy
      - UltraDetailedHeikinAshiMLStrategy
  base_parameters:
    atr_period: 17
    cci_threshold: 90
    ema_trend_period: 50
    kelly_fraction: 0.1
    liquidity_score_min: 5
    max_concurrent_trades: 1
    max_drawdown: 0.03
    max_portfolio_heat: 0.05
    min_rr_ratio: 2.5
    ml_threshold: 0.2
    ml_threshold_max: 0.8
    ml_threshold_min: 0.2
    risk_per_trade: 0.02
    sar_acceleration: 0.04
    sar_maximum: 0.26
    stoch_overbought: 70
    stoch_oversold: 35
    stop_loss_atr_multiplier: 2.25
    take_profit_atr_multiplier: 3.75
  optimized_parameters:
    XAUUSD:
      atr_period: 17
      cci_threshold: 90
      ema_trend_period: 50
      kelly_fraction: 0.1
      liquidity_score_min: 5
      max_concurrent_trades: 1
      max_drawdown: 0.03
      max_portfolio_heat: 0.05
      min_rr_ratio: 2.5
      ml_threshold: 0.2
      ml_threshold_max: 0.8
      ml_threshold_min: 0.2
      risk_per_trade: 0.02
      sar_acceleration: 0.04
      sar_maximum: 0.26
      stoch_overbought: 70
      stoch_oversold: 35
      stop_loss_atr_multiplier: 2.25
      take_profit_atr_multiplier: 3.75
  data_quality:
    min_coverage_pct: 98.0
    auto_retry: true
    gap_fill:
      enabled: false
      method: forward
      max_consecutive: 2
  volume_ratio_min: 0.1
  volume_threshold: 0
  slippage: 0.05
  trading_mode: margin
  margin_type: cross
  margin_leverage: 1

live_trading:
  enabled: false
  mode: "MT5"
  account_type: "DEMO"
  active_symbol: "XAUUSD"
  active_strategy: "UltraDetailedHeikinAshiML"
  risk_per_trade: 0.02
  max_positions: 1
  max_positions_per_symbol: 1
  update_interval_seconds: 5
  initial_history_bars: 1000
  apply_risk_management: true
  mt5_symbols:
    - XAUUSD
  mt5_timeframes:
    - 15m
  strategy_mapping:
    UltraDetailedHeikinAshiML:
      active: true
      symbols:
        - XAUUSD
      timeframes:
        - 15m
      parameters:
        initial_balance: 1000
  validation:
    required_stages:
      - training
      - validation
      - final_test
      - sandbox_demo
    completed_stages:
      training: false
      validation: false
      final_test: false
      sandbox_demo: false
    promotion_rules:
      demo_requires:
        - training
        - validation
        - final_test
      real_requires:
        - training
        - validation
        - final_test
        - sandbox_demo
    allow_real_trading: false
    current_stage: training

compensation_strategy:
  compensation_max_loss: 1.0
  emergency_stop_buffer: 0.8
  enabled: true
  loss_threshold: 0.5
  max_account_drawdown: 3.0
  risk_multiplier_high_dd: 0.7
  size_multiplier: 3.0
  tp_percent: 0.5

data:
  limit_per_request: 2000
  max_retries: 3
  retry_delay: 5
  use_ccxt_for_crypto: false
  use_mt5_for_stocks: true
  validate_data: true

mt5:
  enabled: true
  # Configurar vía variables de entorno MT5_LOGIN y MT5_PASSWORD
  login: null
  password: null
  server: "ThinkMarkets-Demo"
  terminal_path: null
  timeout: 30000

exchanges:
  binance:
    api_key: ""
    api_secret: ""
    enabled: false
    sandbox: true
    timeout: 30000
  kraken:
    api_key: ""
    api_secret: ""
    enabled: false
    sandbox: true
    timeout: 30000
  krakenfutures:
    api_key: ""
    api_secret: ""
    enabled: false
    sandbox: true
    timeout: 30000
  bybit:
    api_key: ""
    api_secret: ""
    enabled: false
    sandbox: true
    timeout: 30000
  okx:
    api_key: ""
    api_secret: ""
    enabled: false
    sandbox: true
    timeout: 30000
  kucoin:
    api_key: ""
    api_secret: ""
    enabled: false
    sandbox: true
    timeout: 30000

indicators:
  adx:
    enabled: true
    period: 14
    threshold: 20
  atr:
    enabled: true
    period: 14
  ema:
    enabled: true
    periods:
      - 10
      - 20
      - 200
  heikin_ashi:
    enabled: true
    size_comparison_threshold: 1.0
    trend_period: 3
  parabolic_sar:
    acceleration: 0.03
    enabled: true
    maximum: 0.25
  volatility:
    enabled: true
    method: standard_deviation
    period: 14

ml_training:
  training:
    train_start: "2017-01-01"
    train_end: "2017-12-31"
    val_start: "2018-01-01"
    val_end: "2018-12-31"
    min_samples: 1000
  optimization:
    enabled: true
    opt_start: "2018-01-01"
    opt_end: "2018-12-31"
    n_trials: 100
